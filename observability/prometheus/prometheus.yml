global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules.yml]
scrape_configs:
  - job_name: control
    static_configs:
      - targets: ['control-plane:9091']
  - job_name: workers
    http_sd_configs:
      - url: http://control-plane:9091/discovery/workers
        refresh_interval: 15s
