server {
 listen __UI_PORT__;
 server_name _;
 absolute_redirect off;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 64m;
 resolver 127.0.0.11 valid=10s ipv6=off;
 set $api http://__API_HOST__:__API_PORT__;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location = /healthz { default_type text/plain; return 200 "ok\n"; }
 location ^~ /client-sub/ {
  access_log off;
  error_log /dev/null crit;
  proxy_pass $api;
  proxy_set_header Host $http_host;
  proxy_set_header Connection '';
  proxy_buffering off;
  proxy_read_timeout 20s;
 }
 location /api/ {
  proxy_pass $api;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header Connection '';
  proxy_buffering off;
  proxy_read_timeout 1h;
 }
 location = /grafana { return 404; }
 location ^~ /grafana/ { return 404; }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
 # expires preserves inherited security headers; a location add_header would
 # suppress the server CSP, including the same-origin worker restriction.
 location / { try_files $uri $uri/ /index.html; expires -1; }
}
